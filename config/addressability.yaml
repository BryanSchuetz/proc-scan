schema_version: 8
status: active
threshold: 2
hard_exclusions:
  - id: sam-goods-product-code
    description: SAM.gov opportunity has a numeric Product and Service Code for goods or supplies.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
      any:
        - field: sourceData.classificationCode
          operator: startsWith
          value: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
  - id: sam-manufacturing-naics
    description: SAM.gov opportunity is assigned to a manufacturing NAICS sector.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
      any:
        - field: sourceData.naicsCode
          operator: startsWith
          value: ["31", "32", "33"]
  - id: sam-dos-dfc-below-minimum-value
    description: DOS and DFC SAM.gov opportunities must have a known value of at least $500,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
        - field: sourceData.federalOrganizationCode
          operator: in
          value: ["019", "077"]
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 500000
  - id: sam-ustda-below-minimum-value
    description: USTDA SAM.gov opportunities must have a known value of at least $250,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "011"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 250000
  - id: sam-mca-below-minimum-value
    description: Millennium Challenge Account SAM.gov opportunities must have a known value of at least $250,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "524"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 250000
      any:
        - field: clientName
          operator: contains
          value: Millennium Challenge Account
        - field: procuringEntityName
          operator: contains
          value: Millennium Challenge Account
        - field: sourceData.fullParentPathName
          operator: contains
          value: Millennium Challenge Account
  - id: sam-mcc-below-minimum-value
    description: MCC SAM.gov opportunities other than Millennium Challenge Accounts must have a known value of at least $500,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: sam-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "524"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 500000
      none:
        - field: clientName
          operator: contains
          value: Millennium Challenge Account
        - field: procuringEntityName
          operator: contains
          value: Millennium Challenge Account
        - field: sourceData.fullParentPathName
          operator: contains
          value: Millennium Challenge Account
  - id: grants-dos-below-minimum-value
    description: DOS Grants.gov opportunities must have a known value of at least $2,000,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: grants-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "019"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 2000000
  - id: grants-dfc-below-minimum-value
    description: DFC Grants.gov opportunities must have a known value of at least $500,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: grants-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "077"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 500000
  - id: grants-ustda-below-minimum-value
    description: USTDA Grants.gov opportunities must have a known value of at least $250,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: grants-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "011"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 250000
  - id: grants-mca-below-minimum-value
    description: Millennium Challenge Account Grants.gov opportunities must have a known value of at least $250,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: grants-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "524"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 250000
      any:
        - field: clientName
          operator: contains
          value: Millennium Challenge Account
        - field: procuringEntityName
          operator: contains
          value: Millennium Challenge Account
        - field: sourceData.fullParentPathName
          operator: contains
          value: Millennium Challenge Account
  - id: grants-mcc-below-minimum-value
    description: MCC Grants.gov opportunities other than Millennium Challenge Accounts must have a known value of at least $500,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: grants-gov
        - field: sourceData.federalOrganizationCode
          operator: equals
          value: "524"
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 500000
      none:
        - field: clientName
          operator: contains
          value: Millennium Challenge Account
        - field: procuringEntityName
          operator: contains
          value: Millennium Challenge Account
        - field: sourceData.fullParentPathName
          operator: contains
          value: Millennium Challenge Account
  - id: ted-below-minimum-eur-value
    description: TED opportunities with a known EUR value must have a value of at least €1,000,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: ted
        - field: value.currency
          operator: equals
          value: EUR
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 1000000
  - id: eu-funding-tenders-below-minimum-eur-value
    description: EU Funding & Tenders opportunities with a known EUR value must have a value of at least €1,000,000.
    conditions:
      all:
        - field: sourceId
          operator: equals
          value: eu-funding-tenders
        - field: value.currency
          operator: equals
          value: EUR
        - field: value.amount
          operator: gt
          value: 0
        - field: value.amount
          operator: lt
          value: 1000000
scoring_rules:
  - id: inclusive-baseline
    description: Every non-excluded opportunity starts from an inclusive baseline.
    points: 2
    conditions:
      all:
        - operator: always
  - id: dai-fit-terms
    description: Opportunity contains positive evidence of DAI fit.
    points: 2
    conditions:
      any:
        - field: opportunityName
          operator: contains
          value:
            - advisory
            - analytics
            - capacity building
            - climate
            - consultancy
            - consultant
            - consulting
            - digital
            - economic growth
            - education
            - environment
